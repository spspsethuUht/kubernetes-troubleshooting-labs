apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
spec:
  restartPolicy: Always
  containers:
  - name: memory-hog
    image: python:3.12-alpine
    command:
    - python
    - -c
    - |
      x=[]
      while True:
          x.append('A' * 1024 * 1024)  # Allocate 1 MB
    resources:
      requests:
        memory: "32Mi"
      limits:
        memory: "64Mi"


